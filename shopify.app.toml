# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "f5f8a8d73616fd619c8fa5b393c6fe9f"
application_url = "https://cheerful-transformation-production-c113.up.railway.app"
embedded = true
name = "image-upload-manager"

[access_scopes]
scopes = "read_files,write_files"

[webhooks]
api_version = "2025-10"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

[auth]
redirect_urls = [ "https://cheerful-transformation-production-c113.up.railway.app/auth/callback" ]

[build]
# Left off on purpose: with this on, every local `shopify app dev` run
# silently overwrites application_url/redirect_urls in the Partner
# Dashboard with that session's temporary Cloudflare tunnel — which then
# breaks the live/QA app for everyone once the dev session ends and the
# tunnel dies. Run `shopify app deploy` explicitly when you actually want
# to push a URL change.
automatically_update_urls_on_dev = false
